[workspace]
members = [
    "crates/dbc-core",
    "crates/dbc-drivers",
    "crates/dbc-desktop",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97"
version = "0.1.0"
publish = false

[workspace.dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
async-stream = "0.3.6"
bigdecimal = "0.4.10"
chrono = { version = "0.4.44", default-features = false, features = ["std"] }
futures-core = "0.3.31"
futures-util = "0.3.31"
# glow(OpenGL) 而非默认的 wgpu：去掉 Linux 上的 Vulkan 驱动要求，
# 虚拟机、远程桌面和老显卡都能直接跑。accesskit 供 egui_kittest 使用。
eframe = { version = "0.35.0", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui_extras = "0.35.0"
egui_code_editor = "0.3.7"
egui_kittest = { version = "0.35.0", features = ["eframe"] }
mongodb = { version = "3.8.0", features = ["redact-errors"] }
redis = { version = "=1.4.1", default-features = false, features = ["tokio-rustls-comp"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
shell-words = "=1.1.1"
sqlparser = { version = "0.62.0", features = ["visitor"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-native-roots", "mysql", "postgres", "sqlite", "bigdecimal", "chrono", "json", "uuid"] }
thiserror = "2.0.18"
tempfile = "3.27.0"
tokio = { version = "1.49.0", features = ["rt-multi-thread", "sync", "time", "macros", "io-util"] }
tokio-util = "0.7.18"
uuid = { version = "1.20.0", features = ["serde", "v4"] }
zeroize = "1.8.2"

[profile.release]
# The binary ships as one file; symbols are what made it large, not code.
strip = "symbols"
# Cross-crate inlining across the egui and sqlx layers, without the build-time
# cost of fat LTO.
lto = "thin"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
